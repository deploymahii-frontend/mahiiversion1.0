version: "3.9"

services:

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  mongodb:
    image: mongo:8
    restart: always
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: always

volumes:
  mongo_data:
