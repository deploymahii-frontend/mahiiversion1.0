name: Backend CI

on:
  push:
    paths:
      - "backend/**"

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: backend

      - run: npm run lint
        working-directory: backend

      - run: npm test
        working-directory: backend
